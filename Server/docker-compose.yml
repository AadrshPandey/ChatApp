services:
  mysql:
    image: mysql:8.4.3
    container_name: mysql_client
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: temp9431
      MYSQL_DATABASE: chatapp
      MYSQL_USER: appuser
      MYSQL_PASSWORD: temp9431
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  redis:
    image: redis:7.4.1
    container_name: redis_client
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:

networks:
  app-network:
    driver: bridge
